<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Browse</title>
    <link rel="shortcut icon" type="image/png" href="./assets/img/logo.png">
    <link rel="stylesheet" type="text/css" href="./assets/css/style.css">
</head>

<body>
    {% include 'header.html' %}
    <main style="min-height: 100vh;">
        {% include 'form.html' %}
        <section class="main_browse">
            <div style="display: block; width: 100%;">
                <h1 style="margin-bottom: 8px; color:#efefef;">Browse {{ repo }}</h1>
                <HR color=#21262d SIZE=1.5>
                {% if not repo %}{% for Data_Repo in DATA_REPOS %}
<h3><li style="color:#efefef;"><a style="color:#efefef;" class="user-properties-link" href="browse.php?repo={{ Data_Repo|urlencode }}">{{ Data_Repo }}</a></li></h3>
{% endfor %}{% else %}
<form method='post' onsubmit='return reSubmit()'>
                        <button style='background-color: #0969da;' class='btn' name='sort' value='plddt'>⇅ Sort by pLDDT</button>
                        <button style='background-color: #0969da;' class='btn' name='sort' value=''>⇅ Sort by name</button>
                        <button style='background-color: #FF5733;' class='btn' title='Refresh cache' onclick="clearCache({{ repo|tojson|forceescape }})">⟳ Refresh</button>
                    </form>
                    <br>
<table><thead><tr align="left"><th>Name</th><th>Structure</th><th>pLDDT</th><th>MSA</th><th>Annotation</th></tr></thead><tbody>
{% for row in rows %}{% include 'browse_row.html' %}{% endfor %}
</tbody></table>{% endif %}
            </div>
        </section>
    </main>
    <script>
        var ifReSubmit = true;

        function clearCache(repoName) {
            var httpRequest = new XMLHttpRequest();
            httpRequest.open("GET", "./api/cache/clear.php?force=true&repo=" + repoName, true);
            httpRequest.send();
            ifReSubmit = false;
            location.reload()
        }

        function reSubmit() {
            return ifReSubmit;
        }
    </script>
</body>

</html>
