<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .viewerSection {
        margin: 24px 0 0 0;
    }

    #{{ Search_Result_Viewer }} {
        width: 100%;
        height: 50vh;
        position: relative;
        z-index: 31;
    }

    /* Raise the host stacking context as well as the expanded canvas. */
    #{{ Search_Result_Viewer }}:has(.msp-layout-expanded) {
        z-index: 100;
    }
</style>
<div class="viewerSection">
    <!-- Molstar container -->
    <div id="{{ Search_Result_Viewer }}"></div>

</div>
<script>
(() => {
    const viewerInstance = new PDBeMolstarPlugin();
    const syncViewerTheme = MineProtMolstarTheme.register(viewerInstance);
    const options = {
        customData: {
            url: {{ Search_Result_Path|tojson }},
            format: 'cif',
            binary: false
        },
        alphafoldView: true,
        // Keep panels inside the viewer, including the sequence above the canvas.
        landscape: true,
        reactive: false,
        hideControls: false,
        sequencePanel: true,
        hideCanvasControls: [],
        bgColor: MineProtMolstarTheme.backgroundColor()
    }

    const viewerContainer = document.getElementById({{ Search_Result_Viewer|tojson }});

    viewerInstance.render(viewerContainer, options).then(syncViewerTheme).catch(error => {
        console.error('Could not load search structure', error);
        viewerContainer.textContent = 'Unable to load structure.';
    });
})();
</script>
