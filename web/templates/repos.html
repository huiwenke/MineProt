{% for Data_Repo in DATA_REPOS %}
    <ul><li><div class="list-item-div">
        <input type="checkbox" id="{{ Data_Repo }}" value="{{ Data_Repo }}" name="repo[]" class="a-item-div"{% if Data_Repo in selected_repos %} checked{% endif %}>
        <label for="{{ Data_Repo }}"><span class="text-primary">{{ Data_Repo }}</span></label>
    </div></li></ul>
{% endfor %}
