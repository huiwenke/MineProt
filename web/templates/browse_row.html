<tr>
<td style="word-wrap:break-word;word-break:break-all;width:20%;"><a class="user-properties-link text-body" href="search.php?search={{ row.name|urlencode }}&repo[]={{ row.repo|urlencode }}" target="_blank"><strong>{{ row.name }}</strong></a></td>
<td><a class="btn btn-file" href="./api/file/{{ row.repo|urlencode }}/{{ row.name|urlencode }}.pdb">PDB</a> <a class="btn btn-file" href="./api/file/{{ row.repo|urlencode }}/{{ row.name|urlencode }}.cif">CIF</a></td>
{% if row.plddt and row.plddt > 0 %}<td class="{{ 'plddt-very-high' if row.plddt >= 90 else 'plddt-confident' if row.plddt >= 70 else 'plddt-low' if row.plddt >= 50 else 'plddt-very-low' }}">{{ '%.2f'|format(row.plddt) }}</td>{% else %}<td>N/A</td>{% endif %}
<td>{% if row.has_a3m %}<a class="btn btn-red" href="./api/file/{{ row.repo|urlencode }}/{{ row.name|urlencode }}.a3m">A3M</a>{% else %}N/A{% endif %}</td>
<td style="word-wrap:break-word;width:50%;"><a target="_blank" title="Similar to {{ row.homolog }}" class="user-properties-link text-body" href="{{ row.homolog_url }}">{{ row.anno }}</a></td>
</tr>
