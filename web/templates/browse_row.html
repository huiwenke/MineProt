<tr>
<td style="word-wrap:break-word;word-break:break-all;width:20%;"><a style="color:#161b22;" class="user-properties-link" href="search.php?search={{ row.name|urlencode }}&repo[]={{ row.repo|urlencode }}" target="_blank"><strong>{{ row.name }}</strong></a></td>
<td><a class="btn" style="background-color:#800080;" href="./api/file/{{ row.repo|urlencode }}/{{ row.name|urlencode }}.pdb">PDB</a> <a class="btn" style="background-color:#800080;" href="./api/file/{{ row.repo|urlencode }}/{{ row.name|urlencode }}.cif">CIF</a></td>
{% if row.plddt and row.plddt > 0 %}<td style="color:white;background-color:{{ 'rgb(0, 83, 214)' if row.plddt >= 90 else 'rgb(101, 203, 243)' if row.plddt >= 70 else 'rgb(255, 219, 19)' if row.plddt >= 50 else 'rgb(255, 125, 69)' }};">{{ '%.2f'|format(row.plddt) }}</td>{% else %}<td>N/A</td>{% endif %}
<td>{% if row.has_a3m %}<a class="btn" style="background-color:#DC143C;" href="./api/file/{{ row.repo|urlencode }}/{{ row.name|urlencode }}.a3m">A3M</a>{% else %}N/A{% endif %}</td>
<td style="word-wrap:break-word;width:50%;"><a target="_blank" title="Similar to {{ row.homolog }}" style="color:#161b22;" class="user-properties-link" href="{{ row.homolog_url }}">{{ row.anno }}</a></td>
</tr>
