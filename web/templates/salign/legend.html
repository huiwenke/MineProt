<section class="aside_right legend-aside" style="float: right; overflow-y: auto;">
    <div style="padding: auto 24px; margin-top: 32px;">
        <h2 class="h2_aside">Page(s)</h2>
        <div style="padding: 8px 0; margin: 8px 0; margin-right: 10px;" class="legend-section">
            <form method="post">
                {% for Page_i in range(1, Page_Info.tot + 1) %}
<button class="btn btn-page{% if Page_Info.page == Page_i %} is-active{% endif %}" style="margin-right:4px; margin-bottom:4px; width:20%;{% if Page_Info.page == Page_i %} pointer-events:none;{% endif %}" type="submit" name="page" value="{{ Page_i }}">{{ Page_i }}</button>
{% endfor %}
            </form>
        </div>
        <div style="padding: 8px 0; margin: 8px 0; margin-right: 10px;" class="legend-section">
            <span class="programming_lang-span">
                <span class="lang_color query-color"></span>
                <span>&nbsp;<strong>Query structure</strong></span>
            </span>
            <br>
            <span class="programming_lang-span">
                <span id="hit_color" class="lang_color plddt-very-high"></span>
                <span>&nbsp;<strong>Hit structure</strong></span>
            </span>
        </div>
        <h2 class="h2_aside">Download</h2>
        <div style="padding: 8px 0; margin: 8px 0; margin-right: 10px;" class="legend-section">
            <a target="_blank" href="../api/cache/get.php?download=true&data_url={{ archive_token|urlencode }}" class="btn btn-purple">
                <center>result.tar.gz</center>
            </a>
        </div>
    </div>
</section>
<script>
    function ChangeColor() {
        var hitColor = document.getElementById("hit_color");
        var colorClasses = ['plddt-very-high', 'plddt-confident', 'plddt-low', 'plddt-very-low'];
        var nextColors = colorClasses.filter(colorClass => !hitColor.classList.contains(colorClass));
        hitColor.classList.remove(...colorClasses);
        hitColor.classList.add(nextColors[Math.floor(Math.random() * nextColors.length)]);
        setTimeout(() => {
            ChangeColor()
        }, 1000)
    }
    ChangeColor();
</script>
