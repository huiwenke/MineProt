<style>
.msp-plugin {
    margin: 0 0 0 0;
}
#{{ Salign_Result_Viewer }} {
    float: center;
    width: 100%;
    height: 50vh;
    position: relative;
    z-index: 31;
}
</style>
<div id="{{ Salign_Result_Viewer }}"></div>
<script>
(() => {
    const viewerInstance = new PDBeMolstarPlugin();
    const syncViewerTheme = MineProtMolstarTheme.register(viewerInstance);
    const options = {
        alphafoldView: true,
        bgColor: MineProtMolstarTheme.backgroundColor(),
        customData: {
            url: {{ Salign_Query_Path|tojson }},
            format: "pdb"
        }
    }

    const viewerContainer = document.getElementById({{ Salign_Result_Viewer|tojson }});

    viewerInstance.render(viewerContainer, options);
    viewerInstance.visual.update({
        alphafoldView: true,
        bgColor: MineProtMolstarTheme.backgroundColor(),
        customData: {url: {{ Salign_Result_Path|tojson }}, format: "cif"}
    }, false);
    syncViewerTheme();
})();
</script>
