services:
  web: &web
    image: localhost/mineprot_web:latest
    container_name: MineWeb
    restart: always
    init: true
    shm_size: "${MP_SHM_SIZE_MB:-64}m"
    build:
      context: .
      dockerfile: app/python/Dockerfile
    user: "${MP_UID:-1000}:${MP_GID:-1000}"
    ports:
      - "${MP_PORT:-80}:8000"
    environment:
      MP_READ_ONLY: "${MP_READ_ONLY:-false}"
      MP_REPO_PATH: /var/www/data
      MP_CACHE_PATH: ${MP_CACHE_PATH:-/tmp/mineprot}
      MP_ELASTICSEARCH: http://elasticsearch:9200
      MP_MAX_BODY_BYTES: "104857600"
      MP_SALIGN_CONCURRENCY: "${MP_SALIGN_CONCURRENCY:-2}"
      MP_SALIGN_TIMEOUT: "${MP_SALIGN_TIMEOUT:-300}"
      MP_FOLDCOMP_TIMEOUT: "${MP_FOLDCOMP_TIMEOUT:-300}"
    volumes:
      - ./web:/app/web:ro
      - ${MP_DATA:-./data}/repo:/var/www/data:${MP_REPO_ACCESS:-rw}
    depends_on:
      es:
        condition: service_healthy
  admin:
    <<: *web
    container_name: MineAdmin
    profiles: [production]
    shm_size: "64m"
    ports:
      - "127.0.0.1:${MP_ADMIN_PORT:-8081}:8000"
    environment:
      MP_READ_ONLY: "false"
      MP_REPO_PATH: /var/www/data
      MP_CACHE_PATH: /tmp/mineprot
      MP_ELASTICSEARCH: http://elasticsearch:9200
      MP_MAX_BODY_BYTES: "104857600"
      MP_FOLDCOMP_TIMEOUT: "${MP_FOLDCOMP_TIMEOUT:-300}"
    volumes:
      - ./web:/app/web:ro
      - ${MP_DATA:-./data}/repo:/var/www/data:rw
  es:
    image: localhost/mineprot_es:latest
    container_name: elasticsearch
    build: ./app/elasticsearch
    restart: always
    volumes:
      - ${MP_DATA:-./data}/es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 30
