[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mineprot-toolkit"
version = "0.1.0"
description = "Import, curate and process protein predictions for MineProt"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.31,<3",
    "urllib3>=2,<3",
    "numpy>=1.26,<3",
    "biopython>=1.83,<2",
    "gemmi==0.7.1",
    "foldcomp==1.0.0",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "ruff>=0.11,<1"]

[project.scripts]
mineprot-toolkit = "mineprot_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

