name: Toolkit checks

on:
  push:
    paths: ["toolkit/**", ".github/workflows/toolkit.yml"]
  pull_request:
    paths: ["toolkit/**", ".github/workflows/toolkit.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: toolkit/pyproject.toml
      - run: python -m pip install -e './toolkit[dev]'
      - run: ruff check toolkit
      - run: ruff format --check toolkit
      - run: python -m unittest discover -s toolkit/tests -v
      - run: python -m build toolkit
